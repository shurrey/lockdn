<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="/lockdn-final-favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- SEO & Social -->
    <title>Lockdn</title>
    <meta name="description" content="Lockdn - Your private, local-first study companion. AI-powered learning with your data staying on your device." />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lockdn" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lockdn" />
    <meta property="og:description" content="Your private, local-first study companion. AI-powered learning with your data staying on your device." />
    <!-- Uncomment when og-image is added:
    <meta property="og:image" content="/og-image.png" />
    -->

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lockdn" />
    <meta name="twitter:description" content="Your private, local-first study companion." />
  </head>

    <script type="module" src="/src/main.tsx"></script>
